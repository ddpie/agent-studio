# MCP Registry — AWS 官方 MCP Servers 完整清单
# 用户在 enabled 字段选择要部署哪些，CDK 读取此文件一键部署
# 部署方式：Runtime + mcp-proxy 桥接 stdio → Streamable HTTP → Gateway mcpServer target

# ─── Gateway 配置 ───
gateway:
  name: aws-mcp-tools
  semantic_search: false  # Gateway 语义搜索，自动筛选最相关的工具给 Agent

# ─── 零部署：直接注册远程 URL ───
remote_targets:
  - name: aws-api
    enabled: true
    description: "AWS 云资源操作，15000+ API"
    endpoint: "https://aws-mcp.us-east-1.api.aws/mcp"
    auth: sigv4
    category: general
    sensitivity: low
    iam_policy: null  # Uses caller's own credentials; permissions depend on actual API called

  - name: aws-knowledge
    enabled: true
    description: "AWS 文档和最佳实践查询，无需凭证"
    endpoint: "https://knowledge-mcp.global.api.aws"
    auth: none
    category: general
    sensitivity: low
    iam_policy: null  # Public endpoint, no IAM needed

# ─── Runtime 部署：awslabs MCP Servers ───
# 每个 target 部署为独立 Runtime，通过 mcp-proxy 桥接
# category: 用于前端分组展示
# vpc_required: 需要 VPC 配置才能连接数据库
# deprecated: 已废弃，建议用替代方案
# iam_actions: Runtime 执行角色需要的 IAM 权限（示例，需按实际调整）

runtime_targets:

  # ━━━ 监控与可观测 ━━━
  - name: cloudwatch
    enabled: true
    package: awslabs-cloudwatch-mcp-server
    command: awslabs.cloudwatch-mcp-server
    version: 0.0.24
    description: "CloudWatch 指标、日志、告警、调查技能"
    category: observability
    sensitivity: medium
    sensitive_reasons:
      - "日志内容可能含 PII、密钥或业务敏感数据"
    iam_policy:
      Statement:
        - Effect: Allow
          Action:
            - cloudwatch:Describe*
            - cloudwatch:Get*
            - cloudwatch:List*
            - logs:Describe*
            - logs:Get*
            - logs:List*
            - logs:StartQuery
            - logs:StopQuery
            - logs:FilterLogEvents
            - application-signals:Get*
            - application-signals:List*
          Resource: "*"

  - name: cloudwatch-applicationsignals
    enabled: true
    package: awslabs-cloudwatch-applicationsignals-mcp-server
    command: awslabs.cloudwatch-applicationsignals-mcp-server
    version: 0.1.29
    description: "Application Signals 性能监控"
    category: observability
    sensitivity: low
    iam_policy:
      Statement:
        - Effect: Allow
          Action:
            - application-signals:GetService
            - application-signals:ListServices
            - application-signals:GetServiceLevelObjective
            - application-signals:ListServiceLevelObjectives
            - application-signals:ListServiceOperations
            - application-signals:ListServiceDependencies
            - application-signals:ListServiceDependents
            - cloudwatch:DescribeAlarms
            - cloudwatch:GetMetricData
            - cloudwatch:GetMetricStatistics
          Resource: "*"

  - name: cloudtrail
    enabled: true
    package: awslabs-cloudtrail-mcp-server
    command: awslabs.cloudtrail-mcp-server
    version: 0.0.12
    description: "CloudTrail 审计日志查询"
    category: observability
    sensitivity: medium
    sensitive_reasons:
      - "可查看账户内所有用户和角色的 API 调用审计日志"
    iam_policy:
      Statement:
        - Effect: Allow
          Action:
            - cloudtrail:LookupEvents
            - cloudtrail:Describe*
            - cloudtrail:Get*
            - cloudtrail:List*
            - cloudtrail:StartQuery
          Resource: "*"

  - name: prometheus
    enabled: true
    package: awslabs-prometheus-mcp-server
    command: awslabs.prometheus-mcp-server
    version: 0.2.14
    description: "Managed Prometheus 指标查询"
    category: observability
    sensitivity: low
    iam_policy:
      Statement:
        - Effect: Allow
          Action:
            - aps:QueryMetrics
            - aps:GetLabels
            - aps:GetMetricMetadata
            - aps:GetSeries
            - aps:ListWorkspaces
            - aps:DescribeWorkspace
          Resource: "*"

  # ━━━ 安全与合规 ━━━
  - name: iam
    enabled: true
    package: awslabs-iam-mcp-server
    command: awslabs.iam-mcp-server
    version: 1.0.17
    description: "IAM 权限管理和策略分析"
    category: security
    sensitivity: medium
    sensitive_reasons:
      - "可读取所有 IAM 用户、角色、策略内容"
      - "iam:Simulate* 可推断任意 role 的 effective permissions"
    iam_policy:
      Statement:
        - Effect: Allow
          Action:
            - iam:Get*
            - iam:List*
            - iam:Simulate*
          Resource: "*"

  - name: well-architected-security
    enabled: true
    package: awslabs-well-architected-security-mcp-server
    command: awslabs.well-architected-security-mcp-server
    version: 0.1.7
    description: "Well-Architected 安全评估"
    category: security
    sensitivity: low
    iam_policy:
      Statement:
        - Effect: Allow
          Action:
            - wellarchitected:GetWorkload
            - wellarchitected:GetLensReview
            - wellarchitected:GetAnswer
            - wellarchitected:ListWorkloads
            - wellarchitected:ListLenses
            - wellarchitected:ListLensReviews
            - wellarchitected:ListAnswers
          Resource: "*"

  # ━━━ 成本与计费 ━━━
  - name: billing-cost-management
    enabled: true
    package: awslabs-billing-cost-management-mcp-server
    command: awslabs.billing-cost-management-mcp-server
    version: 0.0.17
    description: "账单和预算管理（cost-explorer 升级版）"
    category: cost
    sensitivity: medium
    sensitive_reasons:
      - "可查看账户完整的成本和预算数据"
    iam_policy:
      Statement:
        - Effect: Allow
          Action:
            - ce:GetCostAndUsage
            - ce:GetCostForecast
            - ce:DescribeCostCategoryDefinition
            - budgets:ViewBudget
            - budgets:DescribeBudget
          Resource: "*"

  - name: aws-pricing
    enabled: true
    package: awslabs-aws-pricing-mcp-server
    command: awslabs.aws-pricing-mcp-server
    version: 1.0.27
    description: "AWS 定价查询"
    category: cost
    sensitivity: low
    iam_policy: null  # Uses pricing:GetProducts via caller's SigV4 credentials; no extra workspace IAM needed

  # ━━━ 计算 ━━━
  - name: ecs
    enabled: true
    package: awslabs-ecs-mcp-server
    command: ecs-mcp-server
    version: 0.1.28
    description: "ECS 服务管理 + Express Mode 一键部署"
    category: compute
    sensitivity: low
    iam_policy:
      Statement:
        - Effect: Allow
          Action:
            - ecs:DescribeClusters
            - ecs:DescribeServices
            - ecs:DescribeTasks
            - ecs:DescribeTaskDefinition
            - ecs:DescribeContainerInstances
            - ecs:ListClusters
            - ecs:ListServices
            - ecs:ListTasks
            - ecs:ListTaskDefinitions
          Resource: "*"

  - name: eks
    enabled: true
    package: awslabs-eks-mcp-server
    command: awslabs.eks-mcp-server
    version: 0.1.27
    description: "EKS 集群和 K8s 资源管理"
    category: compute
    sensitivity: low
    iam_policy:
      Statement:
        - Effect: Allow
          Action:
            - eks:DescribeCluster
            - eks:DescribeNodegroup
            - eks:DescribeFargateProfile
            - eks:DescribeAddon
            - eks:ListClusters
            - eks:ListNodegroups
            - eks:ListFargateProfiles
            - eks:ListAddons
          Resource: "*"

  - name: lambda-tool
    enabled: false  # disabled: core capability (InvokeFunction) is a HIGH-risk write; MCP useless without it
    package: awslabs-lambda-tool-mcp-server
    command: awslabs.lambda-tool-mcp-server
    version: 2.0.16
    description: "Lambda 函数调用和日志查询"
    category: compute
    sensitivity: high
    sensitive_reasons:
      - "lambda:InvokeFunction 会直接执行任意 Lambda（有副作用）"
    iam_policy:
      Statement:
        - Effect: Allow
          Action:
            - lambda:GetFunction
            - lambda:ListFunctions
            - lambda:GetPolicy
            - logs:DescribeLogGroups
            - logs:GetLogEvents
            - logs:FilterLogEvents
          Resource: "*"

  - name: stepfunctions-tool
    enabled: false  # registers state machines as tools — 0 state machines = 0 tools = Gateway rejects
    package: awslabs-stepfunctions-tool-mcp-server
    command: awslabs.stepfunctions-tool-mcp-server
    version: 0.1.21
    description: "Step Functions 状态机管理"
    category: compute
    sensitivity: low
    iam_policy:
      Statement:
        - Effect: Allow
          Action:
            - states:DescribeStateMachine
            - states:ListStateMachines
            - states:DescribeExecution
            - states:ListExecutions
          Resource: "*"

  # ━━━ 数据库（无需 VPC）━━━
  - name: dynamodb
    enabled: true
    package: awslabs-dynamodb-mcp-server
    command: awslabs.dynamodb-mcp-server
    version: 2.0.24
    description: "DynamoDB 数据建模、schema 校验、CDK 代码生成"
    category: database
    sensitivity: medium
    sensitive_reasons:
      - "Query/Scan/GetItem 可读取任意 DDB 表里的客户数据"
    iam_policy:
      Statement:
        - Effect: Allow
          Action:
            - dynamodb:DescribeTable
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:BatchGetItem
            - dynamodb:ListTables
          Resource: "*"

  - name: s3-tables
    enabled: true
    package: awslabs-s3-tables-mcp-server
    command: awslabs.s3-tables-mcp-server
    version: 0.0.22
    description: "S3 Tables Iceberg 格式"
    category: database
    sensitivity: medium
    sensitive_reasons:
      - "s3:GetObject 可读取任意 S3 对象的内容"
    iam_policy:
      Statement:
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:ListBucket
            - s3tables:GetTable
            - s3tables:GetTableBucket
            - s3tables:ListTables
            - s3tables:ListTableBuckets
            - s3tables:GetTableMetadataLocation
          Resource: "*"

  # ━━━ 数据库（需要 VPC）━━━
  - name: postgres
    enabled: false
    package: awslabs-postgres-mcp-server
    command: awslabs.postgres-mcp-server
    version: 1.1.0
    description: "RDS PostgreSQL 操作"
    category: database
    vpc_required: true
    sensitivity: high
    sensitive_reasons:
      - "rds-db:connect 颁发 DB 连接令牌"
    iam_policy:
      Statement:
        - Effect: Allow
          Action:
            - rds:DescribeDBInstances
            - rds:DescribeDBClusters
            - rds-db:connect
          Resource: "*"

  - name: mysql
    enabled: false
    package: awslabs-mysql-mcp-server
    command: awslabs.mysql-mcp-server
    version: 1.0.17
    description: "RDS MySQL 操作"
    category: database
    vpc_required: true
    sensitivity: high
    sensitive_reasons:
      - "rds-db:connect 颁发 DB 连接令牌"
    iam_policy:
      Statement:
        - Effect: Allow
          Action:
            - rds:DescribeDBInstances
            - rds:DescribeDBClusters
            - rds-db:connect
          Resource: "*"

  - name: documentdb
    enabled: false
    package: awslabs-documentdb-mcp-server
    command: awslabs.documentdb-mcp-server
    version: 1.0.12
    description: "DocumentDB 文档数据库操作"
    category: database
    vpc_required: true
    sensitivity: low
    iam_policy:
      Statement:
        - Effect: Allow
          Action:
            - rds:DescribeDBClusters
            - rds:DescribeDBInstances
          Resource: "*"

  - name: redshift
    enabled: false
    package: awslabs-redshift-mcp-server
    command: awslabs.redshift-mcp-server
    version: 0.0.20
    description: "Redshift 数据仓库查询"
    category: database
    vpc_required: true
    sensitivity: high
    sensitive_reasons:
      - "redshift:GetClusterCredentials 颁发 DB 凭证"
      - "redshift-data:ExecuteStatement 可执行任意 SQL"
    iam_policy:
      Statement:
        - Effect: Allow
          Action:
            - redshift:DescribeClusters
            - redshift:GetClusterCredentials
            - redshift-data:ExecuteStatement
            - redshift-data:DescribeStatement
            - redshift-data:GetStatementResult
          Resource: "*"

  - name: aurora-dsql
    enabled: false
    package: awslabs-aurora-dsql-mcp-server
    command: awslabs.aurora-dsql-mcp-server
    version: 1.0.24
    description: "Aurora DSQL 分布式 SQL"
    category: database
    vpc_required: true
    sensitivity: high
    sensitive_reasons:
      - "dsql:DbConnectAdmin 管理员级 DB 连接"
    iam_policy:
      Statement:
        - Effect: Allow
          Action:
            - dsql:DbConnectAdmin
            - dsql:GetCluster
            - dsql:ListClusters
          Resource: "*"

  - name: neptune
    enabled: false
    package: awslabs-amazon-neptune-mcp-server
    command: awslabs.amazon-neptune-mcp-server
    version: 1.0.15
    description: "Neptune 图数据库查询"
    category: database
    vpc_required: true
    sensitivity: medium
    sensitive_reasons:
      - "neptune-db:ReadDataViaQuery 读取图库数据面内容"
    iam_policy:
      Statement:
        - Effect: Allow
          Action:
            - neptune-db:ReadDataViaQuery
            - rds:DescribeDBClusters
            - rds:DescribeDBInstances
          Resource: "*"

  - name: elasticache
    enabled: false
    package: awslabs-elasticache-mcp-server
    command: awslabs.elasticache-mcp-server
    version: 0.1.16
    description: "ElastiCache Redis/Memcached"
    category: database
    vpc_required: true
    sensitivity: low
    iam_policy:
      Statement:
        - Effect: Allow
          Action:
            - elasticache:DescribeCacheClusters
            - elasticache:DescribeReplicationGroups
            - elasticache:ListTagsForResource
          Resource: "*"

  - name: valkey
    enabled: false
    package: awslabs-valkey-mcp-server
    command: awslabs.valkey-mcp-server
    version: 1.0.15
    description: "Valkey 缓存服务"
    category: database
    vpc_required: true
    sensitivity: low
    iam_policy:
      Statement:
        - Effect: Allow
          Action:
            - elasticache:DescribeReplicationGroups
            - elasticache:DescribeServerlessCaches
            - elasticache:ListTagsForResource
          Resource: "*"

  - name: memcached
    enabled: false
    package: awslabs-memcached-mcp-server
    command: awslabs.memcached-mcp-server
    version: 1.0.15
    description: "Memcached 缓存操作"
    category: database
    vpc_required: true
    sensitivity: low
    iam_policy:
      Statement:
        - Effect: Allow
          Action:
            - elasticache:DescribeCacheClusters
            - elasticache:ListTagsForResource
          Resource: "*"

  - name: timestream-for-influxdb
    enabled: false
    package: awslabs-timestream-for-influxdb-mcp-server
    command: awslabs.timestream-for-influxdb-mcp-server
    version: 0.0.15
    description: "Timestream 时序数据"
    category: database
    vpc_required: true
    sensitivity: medium
    sensitive_reasons:
      - "timestream:SelectValues 读取时序数据"
    iam_policy:
      Statement:
        - Effect: Allow
          Action:
            - timestream:DescribeEndpoints
            - timestream:SelectValues
            - timestream:DescribeDatabase
            - timestream:DescribeTable
            - timestream:ListDatabases
            - timestream:ListTables
          Resource: "*"

  # ━━━ 消息队列 ━━━
  - name: sns-sqs
    enabled: true
    package: awslabs-amazon-sns-sqs-mcp-server
    command: awslabs.amazon-sns-sqs-mcp-server
    version: 2.0.17
    description: "SNS + SQS 消息管理"
    category: messaging
    sensitivity: low
    iam_policy:
      Statement:
        - Effect: Allow
          Action:
            - sns:ListTopics
            - sns:GetTopicAttributes
            - sns:ListSubscriptionsByTopic
            - sqs:ListQueues
            - sqs:GetQueueAttributes
            - sqs:GetQueueUrl
          Resource: "*"

  - name: amazon-mq
    enabled: true
    package: awslabs-amazon-mq-mcp-server
    command: awslabs.amazon-mq-mcp-server
    version: 2.0.19
    description: "Amazon MQ 消息代理"
    category: messaging
    sensitivity: low
    iam_policy:
      Statement:
        - Effect: Allow
          Action:
            - mq:DescribeBroker
            - mq:ListBrokers
            - mq:DescribeConfiguration
            - mq:ListConfigurations
          Resource: "*"

  - name: msk
    enabled: true
    package: awslabs-aws-msk-mcp-server
    command: awslabs.aws-msk-mcp-server
    version: 0.0.17
    description: "MSK (Kafka) 集群管理"
    category: messaging
    sensitivity: low
    iam_policy:
      Statement:
        - Effect: Allow
          Action:
            - kafka:DescribeCluster
            - kafka:DescribeClusterV2
            - kafka:ListClusters
            - kafka:ListClustersV2
            - kafka:GetBootstrapBrokers
            - kafka:ListNodes
            - kafka:DescribeConfiguration
          Resource: "*"

  # ━━━ AI/ML ━━━
  - name: bedrock-kb-retrieval
    enabled: true
    package: awslabs-bedrock-kb-retrieval-mcp-server
    command: awslabs.bedrock-kb-retrieval-mcp-server
    version: 1.0.19
    description: "Bedrock 知识库 RAG 检索"
    category: ai_ml
    sensitivity: medium
    sensitive_reasons:
      - "可检索任意 KB 内容（可能含机密）"
      - "bedrock:RetrieveAndGenerate 调模型，按 token 计费"
    iam_policy:
      Statement:
        - Effect: Allow
          Action:
            - bedrock:Retrieve
            - bedrock:RetrieveAndGenerate
            - bedrock:ListKnowledgeBases
            - bedrock:GetKnowledgeBase
          Resource: "*"

  - name: sagemaker-ai
    enabled: false  # package bug: PydanticUserError in manage_hyperpod_stacks (DeployStackResponse not defined)
    package: awslabs-sagemaker-ai-mcp-server
    command: awslabs.sagemaker-ai-mcp-server
    version: 1.0.7
    description: "SageMaker 模型部署和推理"
    category: ai_ml
    sensitivity: low
    iam_policy:
      Statement:
        - Effect: Allow
          Action:
            - sagemaker:DescribeEndpoint
            - sagemaker:DescribeEndpointConfig
            - sagemaker:DescribeModel
            - sagemaker:DescribeTrainingJob
            - sagemaker:ListEndpoints
            - sagemaker:ListModels
            - sagemaker:ListTrainingJobs
          Resource: "*"

  - name: bedrock-data-automation
    enabled: false  # disabled: core capability requires bedrock:InvokeModel + s3:PutObject (HIGH-risk writes)
    package: awslabs-aws-bedrock-data-automation-mcp-server
    command: awslabs.aws-bedrock-data-automation-mcp-server
    version: 0.0.19
    description: "Bedrock 文档理解和数据提取"
    category: ai_ml
    sensitivity: high
    sensitive_reasons:
      - "bedrock:InvokeModel 调用模型，按 token 计费"
      - "s3:PutObject 向 S3 写入文件"
    iam_policy:
      Statement:
        - Effect: Allow
          Action:
            - s3:GetObject
          Resource: "*"

  - name: bedrock-agentcore
    enabled: true
    package: awslabs-amazon-bedrock-agentcore-mcp-server
    command: awslabs.amazon-bedrock-agentcore-mcp-server
    version: 0.0.16
    description: "AgentCore 资源管理和文档查询"
    category: ai_ml
    sensitivity: low
    iam_policy:
      Statement:
        - Effect: Allow
          Action:
            - bedrock-agentcore:ListAgentRuntimes
            - bedrock-agentcore:GetAgentRuntime
            - bedrock-agentcore:ListGateways
            - bedrock-agentcore:GetGateway
            - bedrock-agentcore:ListGatewayTargets
            - bedrock-agentcore:GetGatewayTarget
          Resource: "*"

  # ━━━ 搜索与知识 ━━━
  - name: kendra-index
    enabled: true
    package: awslabs-amazon-kendra-index-mcp-server
    command: awslabs.amazon-kendra-index-mcp-server
    version: 1.0.15
    description: "Kendra 企业搜索"
    category: search
    sensitivity: medium
    sensitive_reasons:
      - "可检索企业搜索索引（可能含机密）"
      - "kendra:Query 按查询量计费"
    iam_policy:
      Statement:
        - Effect: Allow
          Action:
            - kendra:Query
            - kendra:Retrieve
            - kendra:DescribeIndex
            - kendra:ListIndices
          Resource: "*"

  - name: qindex
    enabled: true
    package: awslabs-amazon-qindex-mcp-server
    command: awslabs.amazon-qindex-mcp-server
    version: 0.0.11
    description: "Amazon Q Index 搜索"
    category: search
    extra_packages: "mypy-boto3-qbusiness"
    sensitivity: medium
    sensitive_reasons:
      - "qbusiness:ChatSync 调用 Q Business 对话（写会话状态 + 计费）"
      - "可读取 Q Business 历史消息"
    iam_policy:
      Statement:
        - Effect: Allow
          Action:
            - qbusiness:ChatSync
            - qbusiness:ListMessages
            - qbusiness:ListApplications
            - qbusiness:GetApplication
          Resource: "*"

  - name: qbusiness-anonymous
    enabled: true
    package: awslabs-amazon-qbusiness-anonymous-mcp-server
    command: awslabs.amazon-qbusiness-anonymous-mcp-server
    version: 0.0.14
    description: "Amazon Q Business 知识问答"
    category: search
    sensitivity: medium
    sensitive_reasons:
      - "qbusiness:ChatSync 调用 Q Business 对话（写会话状态 + 计费）"
      - "可读取 Q Business 历史消息"
    iam_policy:
      Statement:
        - Effect: Allow
          Action:
            - qbusiness:ChatSync
            - qbusiness:ListMessages
            - qbusiness:ListApplications
            - qbusiness:GetApplication
          Resource: "*"

  # ━━━ 网络 ━━━
  - name: network
    enabled: true
    package: awslabs-aws-network-mcp-server
    command: awslabs.aws-network-mcp-server
    version: 0.0.9
    description: "VPC 网络管理"
    category: networking
    sensitivity: low
    iam_policy:
      Statement:
        - Effect: Allow
          Action:
            - ec2:DescribeVpcs
            - ec2:DescribeSubnets
            - ec2:DescribeSecurityGroups
            - ec2:DescribeRouteTables
            - ec2:DescribeNetworkInterfaces
            - ec2:DescribeInternetGateways
            - ec2:DescribeNatGateways
            - ec2:DescribeVpcPeeringConnections
          Resource: "*"

  - name: appsync
    enabled: true
    package: awslabs-aws-appsync-mcp-server
    command: awslabs.aws-appsync-mcp-server
    version: 0.1.11
    description: "AppSync GraphQL 管理"
    category: networking
    sensitivity: low
    iam_policy:
      Statement:
        - Effect: Allow
          Action:
            - appsync:GetGraphqlApi
            - appsync:GetSchemaCreationStatus
            - appsync:GetType
            - appsync:ListGraphqlApis
            - appsync:ListTypes
