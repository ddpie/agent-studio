name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same PR / branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default deny — each job opts in to what it actually needs.
permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────
  # Python: lambda + meta-agent (pytest + coverage + ruff)
  # ─────────────────────────────────────────────────────────
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install python tooling + test deps
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov pytest-mock \
                      boto3 aws-lambda-powertools \
                      strands-agents bedrock-agentcore \
                      pyyaml beautifulsoup4 markdownify pypdf openpyxl \
                      requests httpx websocket-client exceptiongroup \
                      "python-jose[cryptography]" cryptography

      - name: ruff check (lambda + meta-agent + scripts)
        run: |
          ruff check lambda/ meta-agent/ scripts/ \
            --output-format=github --no-fix

      - name: ruff format check
        run: |
          ruff format --check lambda/ meta-agent/

      - name: pytest — lambda CRUD
        working-directory: lambda
        run: |
          PYTHONPATH=. python -m pytest tests/ \
            --cov=shared --cov=crud \
            --cov-report=term \
            --cov-report=xml \
            --cov-fail-under=90 \
            --tb=short -q

      - name: pytest — meta-agent
        working-directory: meta-agent
        run: |
          PYTHONPATH=. python -m pytest tests/ \
            --cov=tools \
            --cov-report=term \
            --cov-report=xml \
            --cov-fail-under=85 \
            --tb=short -q

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: |
            lambda/coverage.xml
            meta-agent/coverage.xml
          retention-days: 7

  # ─────────────────────────────────────────────────────────
  # Frontend: vitest + tsc + eslint
  # ─────────────────────────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: ESLint
        # Type-aware rules just enabled — accept the existing baseline of
        # warnings (mostly no-floating-promises, no-unsafe-* etc) for now.
        # Hard-fail only on errors. Warnings will tighten over time as we
        # promote rules from 'warn' to 'error' in eslint.config.js.
        run: npx eslint . --max-warnings 9999

      - name: Vitest
        run: npx vitest run --coverage

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 7

  # ─────────────────────────────────────────────────────────
  # Integration tests (Lambda + moto)
  # ─────────────────────────────────────────────────────────
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install integration deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-mock moto[dynamodb,s3,secretsmanager] \
                      boto3 aws-lambda-powertools \
                      strands-agents bedrock-agentcore \
                      pyyaml "python-jose[cryptography]"
      - name: pytest integration
        working-directory: lambda
        run: |
          PYTHONPATH=. python -m pytest tests/integration/ \
            --tb=short -v

  # ─────────────────────────────────────────────────────────
  # Lambda invoke-node: node:test
  # ─────────────────────────────────────────────────────────
  invoke-node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lambda/invoke-node
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run node:test
        run: node --test 'tests/*.test.mjs'

  # ─────────────────────────────────────────────────────────
  # Infra CDK: jest snapshot + cdk-nag + cdk synth
  # ─────────────────────────────────────────────────────────
  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - run: npm ci

      - name: Create stub base zips (not in repo, needed for CDK synth)
        run: |
          mkdir -p ../base
          echo "stub" | zip -q ../base/deployment.zip -
          echo "stub" | zip -q ../base/sub-agent-deployment.zip -

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: jest (snapshot + security assertions)
        run: npx jest -u

      # cdk synth skipped — jest snapshot already validates the template compiles.
      # CDK CLI disallows aws:-prefixed context keys from CLI in newer versions.

  # ─────────────────────────────────────────────────────────
  # Bash scripts: shellcheck + bash -n
  # ─────────────────────────────────────────────────────────
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n (syntax check)
        run: |
          for f in scripts/*.sh; do
            bash -n "$f" || exit 1
          done

      - name: shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: error
          scandir: scripts

  # ─────────────────────────────────────────────────────────
  # Quality gates: knip (dead code) + bundle size
  # ─────────────────────────────────────────────────────────
  quality-gates:
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Dead code check (knip, report-only)
        run: npx knip --no-exit-code

      - name: Create stub .env for vite build
        run: |
          printf 'AGENT_STUDIO_REGION=us-east-1\nAGENT_STUDIO_ACCOUNT_ID=123456789012\nAGENT_STUDIO_S3_BUCKET=dummy\nAGENT_STUDIO_META_AGENT_ID=dummy\nAGENT_STUDIO_COGNITO_USER_POOL_ID=us-east-1_x\nAGENT_STUDIO_COGNITO_CLIENT_ID=x\n' > ../.env

      - name: Bundle size gate
        run: bash ../scripts/check-bundle-size.sh

      # TODO: A11y audit (needs browser, skipped in CI for now)
      # - name: A11y audit
      #   run: npx playwright install --with-deps chromium && npx ...

  # ─────────────────────────────────────────────────────────
  # check-invariants — CLAUDE.md ↔ code consistency
  # ─────────────────────────────────────────────────────────
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run check-invariants.sh
        run: bash scripts/check-invariants.sh
